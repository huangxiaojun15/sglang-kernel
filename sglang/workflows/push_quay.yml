name: Release Docker Images Nightly

on:
  workflow_dispatch:
    inputs:
      tag_suffix:
        description: 'tag后缀，如 B021, release20260810'
        required: false
        type: string
        default: 'nightly'

env:
  IMAGE: quay.io/ascend/sglang

jobs:
  build:
    name: build ${{ matrix.platform }}-${{ matrix.device_type }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - device_type: a3
            platform: amd64
            runner: ubuntu-latest
          - device_type: a3
            platform: arm64
            runner: ubuntu-22.04-arm
          - device_type: 950
            platform: amd64
            runner: ubuntu-latest
          - device_type: 950
            platform: arm64
            runner: ubuntu-22.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free up disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true
          docker-images: false

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate full image tag
        run: |
          echo "FULL_TAG=cann9.2.0-${{ matrix.device_type }}-${{ github.event.inputs.tag_suffix || 'main' }}-${{ matrix.platform }}" >> $GITHUB_ENV

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: type=raw,value=${{ env.FULL_TAG }}

      - name: Log into Quay.io
        uses: docker/login-action@v3
        if: ${{ github.repository == 'Ascend/sglang' }}
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_NAME }}
          password: ${{ secrets.QUAY_PWD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/npu_cann9.2.0.Dockerfile
          platforms: linux/${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          outputs: ${{ github.repository == 'Ascend/sglang' && 'type=registry,oci-mediatypes=false' || '' }}
          provenance: false
          sbom: false
          build-args: |
            SGLANG_KERNEL_NPU_TAG=2026.11.0.post13
            CANN_VERSION=9.2.0
            DEVICE_TYPE=${{ matrix.device_type }}

  merge:
    name: merge multi-arch manifest
    needs: build
    if: ${{ github.repository == 'Ascend/sglang' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        device_type: ["a3", "950"]
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into Quay.io
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_NAME }}
          password: ${{ secrets.QUAY_PWD }}

      - name: Create multi-arch manifest
        env:
          IMAGE: quay.io/ascend/sglang:cann9.2.0-${{ matrix.device_type }}-${{ github.event.inputs.tag_suffix || 'main' }}
        run: |
          docker buildx imagetools create \
            -t "${IMAGE}" \
            "${IMAGE}-amd64" \
            "${IMAGE}-arm64"

  manifest:
    needs: merge
    if: ${{ github.repository == 'Ascend/sglang' }}
    uses: ./.github/workflows/generate-image-manifest.yml
    secrets: inherit
    concurrency:
      group: manifest-deploy-${{ github.workflow }}-${{ matrix.device_type }}-${{ github.event.inputs.tag_suffix || 'main' }}
      cancel-in-progress: false
    strategy:
      matrix:
        include:
          - device_type: a3
          - device_type: 950
    with:
      image: quay.io/ascend/sglang:cann9.2.0-${{ matrix.device_type }}-${{ github.event.inputs.tag_suffix || 'main' }}
      dockerfile: docker/npu_cann9.2.0.Dockerfile
      build_args: |
        SGLANG_KERNEL_NPU_TAG=2026.11.0.post13
        CANN_VERSION=9.2.0
        DEVICE_TYPE=${{ matrix.device_type }}
      artifact_name: image-manifest-cann9.2.0-${{ matrix.device_type }}-${{ github.event.inputs.tag_suffix || 'main' }}
      deploy_pages: 'true'